<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전략기획본부 실적 대시보드 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0d1b3e;
  --navy2:#142248;
  --blue:#1e40af;
  --sky:#3b82f6;
  --sky-light:#60a5fa;
  --teal:#0891b2;
  --purple:#7c3aed;
  --green:#059669;
  --orange:#ea580c;
  --rose:#e11d48;
  --gold:#d97706;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
  --light:#94a3b8;
}

body{
  font-family:'Pretendard','Nanum Gothic','나눔고딕','Malgun Gothic','맑은 고딕',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* ── HERO HEADER ── */
.hero{
  background:linear-gradient(135deg,#0d1b3e 0%,#1e3a8a 45%,#1e40af 100%);
  padding:0;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(96,165,250,.18) 0%,transparent 60%),
             radial-gradient(ellipse 40% 40% at 10% 100%,rgba(124,58,237,.12) 0%,transparent 60%);
}
.hero-inner{
  position:relative;z-index:1;
  max-width:1380px;margin:0 auto;
  padding:36px 36px 28px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  flex-wrap:wrap;
}
.hero-brand{display:flex;align-items:center;gap:16px}
.hero-emblem{
  width:56px;height:56px;
  background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  backdrop-filter:blur(8px);
  flex-shrink:0;
}
.hero-text h1{
  font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;
}
.hero-text p{
  font-size:13px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:400;
}
.hero-stats{
  display:flex;align-items:flex-end;gap:28px;
  padding-bottom:2px;
}
.hero-stat{text-align:right}
.hero-stat-val{font-size:30px;font-weight:800;color:#fff;line-height:1}
.hero-stat-lbl{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;font-weight:400}

/* nav tabs */
.nav-tabs{
  background:var(--navy2);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.nav-tabs-inner{
  max-width:1380px;margin:0 auto;
  padding:0 36px;
  display:flex;gap:4px;
}
.nav-tab{
  padding:12px 20px;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.5);
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.nav-tab:hover{color:rgba(255,255,255,.8)}
.nav-tab.active{color:#60a5fa;border-bottom-color:#60a5fa}

/* ── MAIN ── */
.main{max-width:1380px;margin:0 auto;padding:28px 36px 48px}

/* Section label */
.sec-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── KPI CARDS ── */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
  margin-bottom:28px;
}

.kc{
  background:var(--card);
  border-radius:16px;
  padding:22px 20px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s;
}
.kc:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.10)}
.kc::after{
  content:'';
  position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:16px 16px 0 0;
}
.kc-patent::after{background:linear-gradient(90deg,#1e40af,#3b82f6)}
.kc-paper::after {background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.kc-sw::after    {background:linear-gradient(90deg,#059669,#34d399)}
.kc-tech::after  {background:linear-gradient(90deg,#ea580c,#fb923c)}
.kc-equip::after {background:linear-gradient(90deg,#0891b2,#38bdf8)}

.kc-top{display:flex;align-items:flex-start;justify-content:space-between}
.kc-icon-wrap{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.kc-patent .kc-icon-wrap{background:#dbeafe}
.kc-paper  .kc-icon-wrap{background:#ede9fe}
.kc-sw     .kc-icon-wrap{background:#d1fae5}
.kc-tech   .kc-icon-wrap{background:#ffedd5}
.kc-equip  .kc-icon-wrap{background:#cffafe}

.kc-mid{display:flex;align-items:flex-end;gap:6px}
.kc-val{font-size:40px;font-weight:800;line-height:1}
.kc-patent .kc-val{color:#1e40af}
.kc-paper  .kc-val{color:#7c3aed}
.kc-sw     .kc-val{color:#059669}
.kc-tech   .kc-val{color:#ea580c}
.kc-equip  .kc-val{color:#0891b2}
.kc-unit{font-size:15px;font-weight:500;color:var(--muted);margin-bottom:6px}

/* ── CHART ROW ── */
.chart-row{
  display:grid;
  grid-template-columns:3fr 2fr;
  gap:16px;
  margin-bottom:28px;
}
.chart-card{
  background:var(--card);
  border-radius:16px;
  padding:24px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
.chart-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.chart-title{font-size:14px;font-weight:700;color:var(--text)}
.chart-sub  {font-size:12px;color:var(--muted);margin-top:2px}
.chart-legend{
  display:flex;gap:12px;flex-wrap:wrap;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── LINKS STRIP ── */
.links-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:28px;
}
.link-card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.link-card-head{
  font-size:12px;font-weight:700;color:var(--text);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.link-card-head span{font-size:15px}
.lbtn{
  display:flex;align-items:center;gap:7px;
  padding:8px 11px;border-radius:9px;
  font-size:12px;font-weight:600;
  text-decoration:none;
  margin-bottom:6px;
  transition:all .15s;
  border:1px solid transparent;
}
.lbtn:last-child{margin-bottom:0}
.lbtn:hover{filter:brightness(.93);transform:translateX(2px)}
.lbtn-curr{background:#eff6ff;color:#1d4ed8;border-color:#dbeafe}
.lbtn-hist{background:#faf5ff;color:#7c3aed;border-color:#ede9fe}
.lbtn-team{background:#f0fdf4;color:#166534;border-color:#dcfce7}
.lbtn-ico{font-size:13px;flex-shrink:0}
.lbtn-txt{line-height:1.2}

/* ── DETAIL TABLES ── */
.detail-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}
.tbl-card{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
.tbl-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
}
.tbl-ico{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.tbl-ico-patent{background:#dbeafe}
.tbl-ico-sw    {background:#d1fae5}
.tbl-ico-paper {background:#ede9fe}
.tbl-ico-hist  {background:#f1f5f9}
.tbl-head-text h3{font-size:14px;font-weight:700}
.tbl-head-text p{font-size:11px;color:var(--muted);margin-top:1px}
.badge-cnt{
  margin-left:auto;
  background:#f8fafc;border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;
  font-size:12px;font-weight:700;color:var(--muted);
}

table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{
  padding:9px 10px;text-align:left;
  font-weight:700;font-size:11px;color:var(--muted);
  background:#f8fafc;
  border-bottom:1px solid var(--border);
}
table.dt td{
  padding:10px 10px;
  border-bottom:1px solid #f8fafc;
  vertical-align:middle;color:var(--text);
  line-height:1.4;
}
table.dt tr:last-child td{border-bottom:none}
table.dt tr:hover td{background:#fafbfd}
.tag{
  display:inline-block;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:5px;white-space:nowrap;
}
.tag-reg{background:#dcfce7;color:#15803d}
.tag-app{background:#fef9c3;color:#854d0e}
.tag-intl{background:#dbeafe;color:#1d4ed8}
.tag-dom{background:#f3e8ff;color:#7e22ce}
.tag-conf{background:#fff1f2;color:#be123c}
.tag-journ{background:#ecfeff;color:#155e75}
.num-badge{
  font-size:11px;font-weight:700;color:var(--muted);
  background:#f8fafc;border:1px solid var(--border);
  width:22px;height:22px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
}

/* ── PAPER TABLE (wide) ── */
.paper-card{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  margin-bottom:16px;
}

/* ── HISTORY TABLE ── */
.hist-card{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  margin-bottom:16px;
  overflow-x:auto;
}
table.ht{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.ht thead tr{background:linear-gradient(135deg,var(--navy),#1e40af)}
table.ht th{
  padding:12px 16px;color:#fff;font-weight:700;font-size:12px;
  text-align:center;white-space:nowrap;
}
table.ht th:first-child{text-align:left;border-radius:10px 0 0 0}
table.ht th:last-child{border-radius:0 10px 0 0}
table.ht td{
  padding:11px 16px;text-align:center;
  font-weight:600;border-bottom:1px solid #f1f5f9;
  font-size:13px;
}
table.ht td:first-child{text-align:left;font-weight:700;color:var(--text)}
table.ht tr:last-child td{border-bottom:none}
table.ht tr.yr-2026 td{background:#fef3c7;font-weight:800}
table.ht tr.yr-2026 td:first-child{color:#b45309;border-left:4px solid #d97706}
.comp-bar-wrap.curr-yr .comp-yr{color:#d97706;font-weight:700}table.ht tr:not(.yr-2026):hover td{background:#fafbfd}
.c-pat{color:#1d4ed8}.c-pap{color:#7c3aed}
.c-sw{color:#059669}.c-tec{color:#ea580c}.c-eq{color:#0891b2}
.c-tot{color:var(--text);font-weight:800}

/* note */
.note{font-size:11px;color:var(--light);margin-top:10px}

/* footer */
.footer{
  max-width:1380px;margin:0 auto;
  padding:20px 36px;
  text-align:center;
  font-size:12px;color:var(--light);
  border-top:1px solid var(--border);
}

@media(max-width:1100px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .links-row{grid-template-columns:repeat(3,1fr)}
  .chart-row{grid-template-columns:1fr}
}
/* ── CSS 막대 차트 ── */
.cc-area{display:flex;align-items:flex-end;gap:7px;padding-bottom:0}
.cc-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.cc-top-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;line-height:1}
.cc-bar{width:100%;display:flex;flex-direction:column-reverse;gap:1px;border-radius:3px 3px 0 0;overflow:hidden}
.cc-s{width:100%;flex-shrink:0;min-height:0}
.cc-yr{font-size:10px;color:var(--muted);margin-top:6px;font-weight:500;white-space:nowrap}
.cc-col.col-cur .cc-yr{color:var(--primary);font-weight:800}
.cc-col.col-cur .cc-bar{outline:2px dashed #93c5fd;outline-offset:1px;border-radius:3px}
.s-pat{background:#3b82f6}.s-pap{background:#a78bfa}
.s-sw{background:#34d399}.s-tec{background:#fb923c}

/* ── 전년비교 카드 ── */
.comp-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.comp-row:last-child{margin-bottom:0}
.comp-cat{width:72px;font-size:11px;font-weight:700;color:var(--text);flex-shrink:0}
.comp-bars{flex:1;display:flex;flex-direction:column;gap:5px}
.comp-bar-wrap{display:flex;align-items:center;gap:7px}
.comp-yr{width:28px;font-size:10px;color:var(--light);text-align:right;flex-shrink:0}
.comp-track{flex:1;height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.comp-fill{height:100%;border-radius:4px;transition:width .6s ease}
.comp-n{width:22px;font-size:11px;font-weight:700;color:var(--text);text-align:right;flex-shrink:0}
.comp-delta{
  width:36px;text-align:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.d-up{color:#059669}.d-dn{color:#94a3b8}.d-eq{color:#94a3b8}

/* ── 페이지 전환 ── */
.page-section{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── 탭 페이지 내 링크 배너 ── */
.page-links{
  display:flex;gap:10px;flex-wrap:wrap;
  background:var(--card);border-radius:14px;
  padding:16px 20px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  margin-bottom:16px;align-items:center;
}
.page-links-label{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;flex-shrink:0}
.page-links .lbtn{margin-bottom:0}
@media(max-width:700px){
  .main{padding:20px 16px 40px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .links-row{grid-template-columns:1fr 1fr}
  .detail-row{grid-template-columns:1fr}
  .hero-inner{padding:24px 20px 20px}
  .nav-tabs-inner{padding:0 16px;overflow-x:auto}
}
</style>
</head>
<body>
<style>
#gate{position:fixed;inset:0;z-index:99999;
  font-family:'Pretendard','Nanum Gothic','나눔고딕','Malgun Gothic','맑은 고딕',sans-serif;
  color:#0f172a;font-size:14px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:#f1f5f9}
#gate *{box-sizing:border-box}
#gate form{margin:0}
#gate .msg{margin-top:14px;font-size:12.5px;min-height:18px;color:#e11d48}
#gate .msg.busy{color:#64748b}
#gate .lock{display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:#94a3b8;margin-top:22px}
#gate .lock svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
#gate .sig{margin-left:auto;padding-left:12px;font-size:12px;font-weight:600;
  color:#94a3b8;letter-spacing:.2px;white-space:nowrap}
#gate label.f{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:7px}
#gate input.pw{width:100%;padding:12px 14px;border:1px solid #cbd5e1;
  border-radius:10px;font-size:14px;font-family:inherit;color:#0f172a;
  background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
#gate input.pw:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
#gate .rem{display:flex;align-items:center;gap:8px;margin:14px 0 22px;
  font-size:12.5px;color:#475569;cursor:pointer;user-select:none}
#gate .rem input{width:15px;height:15px;accent-color:#1e40af;cursor:pointer}
#gate button[type=submit]{width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;
  background:#1e40af;color:#fff;font-size:14px;font-weight:700;font-family:inherit;
  letter-spacing:-.2px;transition:background .15s}
#gate button[type=submit]:hover:not(:disabled){background:#1a3691}
#gate button[type=submit]:disabled{background:#cbd5e1;cursor:default}
body.locked{overflow:hidden}
body.locked>*:not(#gate){display:none !important}

#gate{padding:0}
#gate .box{display:grid;grid-template-columns:1fr 1fr;
  width:100%;max-width:840px;min-height:430px;margin:24px;
  background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 20px rgba(13,27,62,.07)}
#gate .side{position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0d1b3e 0%,#1e3a8a 45%,#1e40af 100%);
  color:#fff;padding:44px 38px;display:flex;flex-direction:column}
#gate .side::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(96,165,250,.20) 0%,transparent 60%),
             radial-gradient(ellipse 45% 45% at 5% 105%,rgba(124,58,237,.16) 0%,transparent 60%)}
#gate .side>*{position:relative;z-index:1}
#gate .side .mark{width:52px;height:52px;border-radius:16px;font-size:25px;
  background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:auto}
#gate .side h1{font-size:23px;font-weight:800;letter-spacing:-.5px;
  margin:0 0 10px;line-height:1.34}
#gate .side p{font-size:12.5px;color:rgba(255,255,255,.68);margin:0;line-height:1.7;
  font-weight:400}
#gate .side .kv{display:flex;gap:24px;margin-top:22px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.13)}
#gate .side .kv b{display:block;font-size:11px;font-weight:400;
  color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.02em}
#gate .side .kv span{font-size:17px;font-weight:800;letter-spacing:-.3px}
#gate .pane{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
#gate .pane .ttl{font-size:15px;font-weight:700;margin:0 0 6px;letter-spacing:-.2px}
#gate .pane .sub{font-size:12.5px;color:#64748b;margin:0 0 24px}
@media(max-width:760px){
  #gate .box{grid-template-columns:1fr;min-height:0;margin:16px}
  #gate .side{padding:30px 28px 26px}
  #gate .side .mark{width:44px;height:44px;font-size:21px;border-radius:13px;margin-bottom:18px}
  #gate .side h1{font-size:19px}
  #gate .side p{font-size:12px}
  #gate .side .kv{display:none}
  #gate .pane{padding:30px 28px 34px}
  #gate .pane .ttl{display:none}
  #gate .pane .sub{margin-bottom:18px}
}

#gate{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overflow-y:auto;overscroll-behavior:contain}
body.locked{overflow:hidden;overscroll-behavior:none}

/* iOS는 16px 미만 입력창에 포커스하면 화면을 확대해버린다 → 16px 고정 */
#gate input.pw{font-size:16px}

/* 암호 표시 토글 */
#gate .field{position:relative}
#gate .field input.pw{padding-right:48px}
#gate button.peek,#gate button.peek:hover{width:40px;height:40px;padding:0;margin:0;
  position:absolute;top:50%;right:5px;transform:translateY(-50%);
  border:0;border-radius:10px;background:transparent;box-shadow:none;
  color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer}

  var KEY = 'kiapikpi_pw';
  var msg = document.getElementById('gmsg');
  var btn = document.getElementById('gbtn');
  var pw  = document.getElementById('gpw');
  var peek = document.getElementById('gpeek');
  var LABEL = btn.textContent;
  var FINE = !!(window.matchMedia && matchMedia('(pointer:fine)').matches);
  document.body.classList.add('locked');

  function busy(on){
    btn.disabled = on;
    if (on) { btn.innerHTML = '<span class="spin"></span>확인 중'; }
    else { btn.textContent = LABEL; }
  }

  function b2a(b64s){
    var s = atob(b64s), a = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) a[i] = s.charCodeAt(i);
    return a;
  }

  async function unlock(password){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(password),
                    {name:'PBKDF2'}, false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(VAULT.salt), iterations:VAULT.it, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b2a(VAULT.iv)}, key, b2a(VAULT.ct));
    return new TextDecoder().decode(plain);
  }

  function run(html){
    document.body.classList.remove('locked');
    var g = document.getElementById('gate');
    if (g) g.remove();

    // innerHTML로 넣은 <script>는 실행되지 않는다 → 떼어내고 script 요소로 다시 주입
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var codes = [];
    Array.prototype.slice.call(tmp.querySelectorAll('script')).forEach(function(s){
      codes.push({src:s.getAttribute('src'), text:s.textContent});
      s.parentNode.removeChild(s);
    });
    while (tmp.firstChild) document.body.appendChild(tmp.firstChild);
    codes.forEach(function(c){
      var s = document.createElement('script');
      if (c.src) s.src = c.src; else s.textContent = c.text;
      document.body.appendChild(s);
    });
  }

  async function attempt(password, remember, silent){
    busy(true);
    msg.className = 'msg busy';
    msg.textContent = '';
    try {
      var html = await unlock(password);
      if (remember) { try { localStorage.setItem(KEY, password); } catch(e){} }
      run(html);
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch(e2){}
      busy(false);
      msg.className = 'msg';
      msg.textContent = silent ? '' : '암호가 맞지 않습니다.';
      pw.value = ''; pw.focus();
    }
  }

  if (!(window.crypto && crypto.subtle)) {
    msg.className = 'msg';
    // 파일 직접 열기(file://)나 http:// 접속은 브라우저가 복호화 API를 막는다
    msg.textContent = (location.protocol === 'https:' || location.hostname === 'localhost')
      ? '이 브라우저에서는 복호화를 지원하지 않습니다.'
      : '보안 연결(https)로 접속해야 열람할 수 있습니다.';
    btn.disabled = true;
    return;
  }

  document.getElementById('gform').addEventListener('submit', function(ev){
    ev.preventDefault();
    if (!pw.value || btn.disabled) return;
    pw.blur();   // 모바일: 키보드를 내려 진행 상태가 보이게
    attempt(pw.value, document.getElementById('gremember').checked, false);
  });

  // 암호 표시/숨김 (모바일 오타 확인용)
  if (peek) peek.addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    peek.setAttribute('aria-pressed', show ? 'true' : 'false');
    peek.setAttribute('aria-label', show ? '암호 숨김' : '암호 표시');
    document.getElementById('gicon-on').style.display  = show ? 'none' : '';
    document.getElementById('gicon-off').style.display = show ? '' : 'none';
    pw.focus();
    try { pw.setSelectionRange(pw.value.length, pw.value.length); } catch(e){}
  });

  // 모바일 키보드가 올라올 때 입력창이 가려지지 않도록
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function(){
      if (document.activeElement === pw && pw.scrollIntoView)
        pw.scrollIntoView({block:'center', behavior:'smooth'});
    });
  }

  // 자동 포커스는 마우스 환경에서만 — 터치에서는 키보드가 튀어오르지 않게
  if (FINE) pw.focus();

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) attempt(saved, true, true);
})();
</script>
